<details class="saved-backup"><summary>备份与迁移收藏</summary><p>备份包含收藏条目和已保存的速读。中文版网页可在本机阅读器中单独下载；导入备份会保留已有收藏。</p><div class="saved-backup-actions"><button type="button" id="saved-export">导出收藏备份</button><label>选择备份文件<input id="saved-import-file" type="file" accept="application/json,.json"></label><button type="button" id="saved-import" disabled>确认合并导入</button></div><p id="saved-backup-status" role="status"></p></details>

<script>
(function(){
  const KEY='jd_favorites', grid=document.getElementById('saved-grid'), query=document.getElementById('saved-query'), empty=document.getElementById('saved-empty'), status=document.getElementById('saved-status');
  const READER_ORIGIN="http://127.0.0.1:8776";
  const ARXIV_ID=/^(\d{4})\.(\d{4,5})(?:v\d+)?$/;
  let kind='all';
  function read(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return x&&typeof x==='object'&&!Array.isArray(x)?x:{};}catch(_){return {};}}
  function type(item){return /course$/.test(item.kind||'')?'course':item.kind==='article'?'article':'paper';}
  function courseLabel(item){
    return {'health-course':'健康课程','advanced-course':'进阶课程'}[item.kind] || 'AI 课程';
  }
  function safeUrl(value){
    if(typeof value!=='string'||/[\x00-\x20\x7f]/.test(value))return '';
    if(/^https?:\/\//i.test(value)){try{const u=new URL(value);return !u.username&&!u.password?u.href:'';}catch(_){return '';}}
    return /^(?:health|learn(?:-\d{8})?|latest|advanced)\.html(?:#[A-Za-z0-9_-]+)?$/.test(value)?value:'';
  }
  function paperReadingUrl(value,id){
    if(typeof value!=='string')return '';
    const paper=ARXIV_ID.exec(id);
    if(!paper||paper[0]!==id)return '';
    const match=/^\/research-editions\/([1-9]\d{3})(\d{2})(\d{2})-[a-f0-9]{12}\.html#paper-(\d{4})-(\d{4,5})$/.exec(value);
    if(!match||match[0]!==value||match[4]!==paper[1]||match[5]!==paper[2])return '';
    const dateText=match.slice(1,4).join('-'), date=new Date(dateText+'T00:00:00Z');
    return Number.isFinite(date.getTime())&&date.toISOString().slice(0,10)===dateText?value:'';
  }
  function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text)el.textContent=text;return el;}
  function shortText(value,limit){return typeof value==='string'?value.trim().slice(0,limit):'';}
  function httpsUrl(value){
    if(typeof value!=='string'||value.length>4096||!/^https:\/\/[^/]/i.test(value)||/[\x00-\x20\x5c\x7f]/.test(value))return '';
    try{const u=new URL(value);return u.protocol==='https:'&&!u.username&&!u.password&&!u.port?u.href:'';}catch(_){return '';}
  }
  function summaryOnly(item){
    if(item.reading_summary_only===true)return true;
    try{const u=new URL(item.url);return /(^|\.)shubs\.io$/i.test(u.hostname);}catch(_){return false;}
  }
  function readingPreview(item){
    const supplied=shortText(item.reading_excerpt,2000), legacy=shortText(item.one_liner,2000);
    if(supplied)return {excerpt:supplied,source:shortText(item.reading_source,160)||'收藏时保留的速读'};
    if(!summaryOnly(item)&&/[\u3400-\u9fff]/.test(legacy))return {excerpt:legacy,source:'收藏时保留的摘要'};
    return {excerpt:'',source:''};
  }
  function appendArticleReading(card,item,preview){
    if(preview.excerpt&&/[\u3400-\u9fff]/.test(preview.excerpt)){
      const fold=node('details','saved-preview');
      fold.append(node('summary','','已保存的中文速读'),node('p','',preview.excerpt),
        node('p','saved-preview-source',preview.source+' · 摘要'));
      card.append(fold);
    }
    const url=httpsUrl(item.url);
    if(!url)return;
    const request={url,title_zh:shortText(item.title_zh,500),title_en:shortText(item.title_en,500),
      reading_excerpt:preview.excerpt,reading_source:preview.source,discussion_url:httpsUrl(item.discussion_url),
      reading_summary_only:summaryOnly(item)};
    const link=node('a','saved-reader-link','阅读或保存中文版 ↗');
    link.href=READER_ORIGIN+'/#'+encodeURIComponent(JSON.stringify(request));
    link.target='_blank';link.rel='noopener noreferrer';card.append(link);
  }
  function savedDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?'':date.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'});}
  function render(){
    const all=Object.entries(read()).filter(([,v])=>v&&typeof v==='object'&&!Array.isArray(v));
    const terms=query.value.normalize('NFKC').trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
    const matches=all.filter(([,p])=>{
      const text=[p.title_zh,p.title_en,p.one_liner,p.reading_excerpt,p.topic,p.category].join(' ').normalize('NFKC').toLocaleLowerCase();
      return (kind==='all'||type(p)===kind)&&terms.every(term=>text.includes(term));
    });
    matches.sort((a,b)=>String(b[1].saved_at||'').localeCompare(String(a[1].saved_at||'')));
    grid.replaceChildren();status.textContent='共 '+all.length+' 项收藏 · 当前显示 '+matches.length+' 项';empty.hidden=matches.length>0;
    if(!matches.length){
      empty.replaceChildren(node('p','',all.length?'没有匹配的收藏，试试其他关键词或类型。':'还没有收藏。在文章或课程旁点击“收藏”，就可以留到这里。'));
      if(!all.length){const a=node('a','','去健康课程库看看 ↗');a.href='health.html#health-library';empty.append(a);}
    }
    matches.forEach(([key,p])=>{
      const card=node('article','saved-card'), contentType=type(p), label=contentType==='course'?courseLabel(p):contentType==='article'?'文章':'论文';
      card.append(node('p','saved-meta',[...new Set([label,p.topic||p.category].filter(Boolean))].join(' · ')));
      const id=String(p.id||key), url=safeUrl(p.url)||(contentType==='paper'&&ARXIV_ID.test(id)?'https://arxiv.org/abs/'+id:'');
      const linkUrl=summaryOnly(p)?'':url;
      const readingUrl=contentType==='paper'?paperReadingUrl(p.reading_url,id):'';
      const heading=node('h2'), title=node(linkUrl&&!readingUrl?'a':'span','',String(p.title_zh||p.title_en||p.id||key));
      if(linkUrl&&!readingUrl)title.href=linkUrl;heading.append(title);card.append(heading);
      const preview=contentType==='article'?readingPreview(p):null;
      if(p.one_liner&&!summaryOnly(p)&&!(preview&&/[\u3400-\u9fff]/.test(preview.excerpt)))card.append(node('p','saved-desc',String(p.one_liner)));
      else if(p.title_en&&p.title_en!==p.title_zh)card.append(node('p','saved-desc',String(p.title_en)));
      if(preview)appendArticleReading(card,p,preview);
      if(readingUrl){
        const actions=node('div','saved-paper-actions'), review=node('a','saved-paper-review','回看当期解读');
        review.href=readingUrl;actions.append(review);
        if(linkUrl){const original=node('a','','看原文');original.href=linkUrl;actions.append(original);}
        card.append(actions);
      }
      const footer=node('div','saved-footer'), date=savedDate(p.saved_at);footer.append(node('span','',date?'收藏于 '+date:''));
      const remove=node('button','saved-remove','取消收藏');remove.type='button';remove.setAttribute('aria-label','取消收藏：'+String(p.title_zh||p.id||key));
      remove.addEventListener('click',()=>{const saved=read();delete saved[key];try{localStorage.setItem(KEY,JSON.stringify(saved));render();}catch(_){status.textContent='暂时无法更新收藏。';}});
      footer.append(remove);card.append(footer);grid.append(card);
    });
  }
  const exportButton=document.getElementById('saved-export'), importButton=document.getElementById('saved-import'), fileInput=document.getElementById('saved-import-file'), backupStatus=document.getElementById('saved-backup-status');
  let pendingImport=null, importGeneration=0;
  if(exportButton&&importButton&&fileInput&&backupStatus){
    exportButton.addEventListener('click',()=>{
      const data={format:'jae-daily-favorites',version:1,exported_at:new Date().toISOString(),items:read()};
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url;a.download='jae-favorites-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
      backupStatus.textContent='已导出当前站点的收藏。';
    });
    fileInput.addEventListener('change',async()=>{
      const generation=++importGeneration;pendingImport=null;importButton.disabled=true;
      const file=fileInput.files&&fileInput.files[0];if(!file)return;
      if(file.size>4*1024*1024){backupStatus.textContent='备份过大，请选择 4 MB 以内的收藏文件。';return;}
      try{
        const raw=await file.text();if(generation!==importGeneration)return;
        const parsed=JSON.parse(raw);
        if(!parsed||parsed.format!=='jae-daily-favorites'||parsed.version!==1||!parsed.items||typeof parsed.items!=='object'||Array.isArray(parsed.items))throw Error('format');
        const entries=Object.entries(parsed.items);if(entries.length>2000)throw Error('size');
        const clean=Object.create(null);let rejected=0;
        entries.forEach(([id,item])=>{
          if(!item||typeof item!=='object'||Array.isArray(item)||!id||id.length>180||['__proto__','constructor','prototype'].includes(id)||/[\x00-\x1f]/.test(id)){rejected++;return;}
          const value={id};
          ['kind','title_zh','title_en','one_liner','category','topic','saved_at','published'].forEach(k=>{if(typeof item[k]==='string')value[k]=item[k].slice(0,k==='one_liner'?2000:500);});
          if(value.kind==='article'){
            const excerpt=shortText(item.reading_excerpt,2000), source=shortText(item.reading_source,160), discussion=httpsUrl(item.discussion_url);
            if(excerpt)value.reading_excerpt=excerpt;
            if(source)value.reading_source=source;
            if(discussion)value.discussion_url=discussion;
            if(item.reading_summary_only===true)value.reading_summary_only=true;
          }
          if(type(value)==='paper'){
            const readingUrl=paperReadingUrl(item.reading_url,id);
            if(readingUrl)value.reading_url=readingUrl;
          }
          if(item.url){const url=safeUrl(item.url);if(!url){rejected++;return;}value.url=url;}
          else if(!ARXIV_ID.test(id)){rejected++;return;}
          if(!value.title_zh&&!value.title_en){rejected++;return;}clean[id]=value;
        });
        pendingImport=clean;const n=Object.keys(clean).length;importButton.disabled=!n;
        backupStatus.textContent='可导入 '+n+' 项'+(rejected?'；已跳过 '+rejected+' 项无效记录':'')+'。点击“确认合并导入”后才会保存。';
      }catch(_){if(generation!==importGeneration)return;backupStatus.textContent='无法读取备份，请选择 Jae Daily 导出的 JSON 文件。';}
    });
    importButton.addEventListener('click',()=>{
      if(!pendingImport)return;
      const existing=read();let added=0;
      Object.entries(pendingImport).forEach(([key,item])=>{if(!Object.prototype.hasOwnProperty.call(existing,key)){Object.defineProperty(existing,key,{value:item,enumerable:true,writable:true,configurable:true});added++;}});
      try{localStorage.setItem(KEY,JSON.stringify(existing));pendingImport=null;importButton.disabled=true;backupStatus.textContent='已合并新增 '+added+' 项，已有收藏保持不变。';render();}
      catch(_){backupStatus.textContent='无法保存，当前收藏未被清空。';}
    });
  }
  query.addEventListener('input',render);
  document.querySelectorAll('.saved-filter').forEach(button=>button.addEventListener('click',()=>{kind=button.dataset.kind;document.querySelectorAll('.saved-filter').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render();}));
  window.addEventListener('storage',event=>{if(event.key===KEY)render();});window.addEventListener('pageshow',render);render();
})();
</script></body></html>
